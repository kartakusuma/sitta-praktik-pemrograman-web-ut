<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SITTA UT</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="container login">

        <div class="card card-login">

            <div class="login-logo-container">
                <img src="assets/logo-ut.png" alt="Logo" class="login-logo">
            </div>

            <h2 class="login-title">SITTA</h2>

            <form action="#" id="loginForm">
                <div class="input-group">
                    <label for="email">Email</label>
                    <input type="email" name="email" placeholder="email@ut.ac.id" required>
                </div>

                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" name="password" placeholder="******" required>
                </div>

                <div class="text-right">
                    <a href="#" id="btnLupaPassword">Lupa Password?</a>
                </div>

                <button type="submit" class="btn btn-primary btn-large">Login</button>
            </form>

            <div class="text-center">
                <span>Belum punya akun? <a href="#" id="btnDaftar">Daftar</a></span>
            </div>
        </div>

    </div>

    <!-- Modal Lupa Password -->
    <div class="modal" id="modalLupaPassword">
        <div class="modal-content modal-info">
            <div class="modal-header">
                <h3>Lupa Password</h3>
                <span class="close-btn" data-target="modalLupaPassword">&times;</span>
            </div>
            <div class="modal-body">
                <p>Fitur lupa password akan segera hadir!</p>
                <button class="btn btn-primary btn-small close-modal-btn" data-target="modalLupaPassword">Tutup</button>
            </div>
        </div>
    </div>

    <!-- Modal Daftar -->
    <div class="modal" id="modalDaftar">
        <div class="modal-content modal-info">
            <div class="modal-header">
                <h3>Daftar</h3>
                <span class="close-btn" data-target="modalDaftar">&times;</span>
            </div>
            <div class="modal-body">
                <p>Silakan hubungi administrator untuk mendaftar.</p>
                <button class="btn btn-primary btn-small close-modal-btn" data-target="modalDaftar">Tutup</button>
            </div>
        </div>
    </div>

    <!-- Modal Gagal Login -->
    <div class="modal" id="modalGagalLogin">
        <div class="modal-content modal-danger">
            <div class="modal-header">
                <h3>Gagal Login</h3>
                <span class="close-btn" data-target="modalGagalLogin">&times;</span>
            </div>
            <div class="modal-body">
                <p>Email atau password yang Anda masukkan tidak valid.</p>
                <button class="btn btn-primary btn-small close-modal-btn" data-target="modalGagalLogin">Tutup</button>
            </div>
        </div>
    </div>

    <script type="module" src="js/global.js"></script>
    <script type="module" src="js/loginPage.js"></script>
</body>

</html>
